name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck src/scan.sh
      # The trufflehog action (bumped by Dependabot) and the image it runs must be the same version.
      - name: trufflehog image matches the trufflehog action
        run: |
          action=$(grep -oE 'trufflehog@[0-9a-f]+ # v[0-9.]+' action.yml | sed 's/.*# v//')
          image=$(awk '/trufflehog-version:/{f=1} f && /default:/{gsub(/[" ]/,"",$2); print $2; exit}' action.yml)
          echo "action=$action image=$image"
          test -n "$action" && test "$action" = "$image"

  # Default mode on this repo's own pull request or push: both scanners, nothing to find.
  dogfood-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./

  # Range mode: a clean commit passes both scanners; a commit with a token-shaped string is refused.
  # The token is made up at run time, so it is never in this repo's history.
  dogfood-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make a clean commit and one with a fake token
        run: |
          git config user.name ci && git config user.email ci@kilotronic.com
          echo "token = ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)" > leak.txt
          git add leak.txt && git commit -q -m leak
          git rm -q leak.txt && echo hello > clean.txt && git add clean.txt && git commit -q -m clean
      - uses: ./
        with:
          commits: HEAD~1..HEAD
      - uses: ./
        id: leak
        continue-on-error: true
        with:
          commits: HEAD~2..HEAD~1
          trufflehog: "false" # the fake token can't be verified, so only gitleaks would catch it
      - name: The scan must refuse the fake token
        run: test "${{ steps.leak.outcome }}" = "failure"

  # The pre-commit/prek hooks: a clean sample passes, a fake token is refused, at commit and at push.
  prek-hooks:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@kilotronic.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@kilotronic.com
    steps:
      - uses: actions/checkout@v4
      - run: pip install prek==0.5.11
      - name: prek try-repo against sample files
        run: |
          hooks="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)" && git init -q
          echo hello > clean.txt && git add clean.txt
          prek try-repo "$hooks" secret-scan
          git commit -q -m clean
          echo "token = ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)" > leak.txt && git add leak.txt
          if prek try-repo "$hooks" secret-scan; then echo "::error::the staged fake token was not refused"; exit 1; fi
          git commit -q -m leak
          git rm -q leak.txt && git commit -q -m clean2
          prek try-repo "$hooks" secret-scan-push --hook-stage pre-push --from-ref HEAD~1 --to-ref HEAD
          if prek try-repo "$hooks" secret-scan-push --hook-stage pre-push --from-ref HEAD~2 --to-ref HEAD~1; then
            echo "::error::the pushed fake token was not refused"; exit 1
          fi

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, dogfood-default, dogfood-range, prek-hooks, data-leak-check]
    if: always()
    steps:
      - name: Every job must succeed
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "results: $r"
          for x in $r; do [ "$x" = success ] || exit 1; done
